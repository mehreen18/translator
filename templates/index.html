<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Translation Tool</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet" />
</head>
<body class="bg-dark">

  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top py-3">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" href="#">
        <img src="{{ url_for('static', filename='images/t1.jfif') }}" alt="Logo" width="36" height="36" class="rounded-circle">
        Translator
      </a>
    </div>
  </nav>

  <div class="container py-5">

    <h1 class="text-center fw-bold text-light mb-5">🌍 Language Translation Tool</h1>

    <div class="row g-4 align-items-center">

      <!-- LEFT CARD: input -->
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <select id="sourceLang" class="form-select mb-3">
              <option value="auto">Detect Language</option>
              {% for name, code in supported_languages.items() %}
                <option value="{{ code }}">{{ name.title() }}</option>
              {% endfor %}
            </select>

            <textarea id="inputText" class="form-control" rows="8" placeholder="Type text here..."></textarea>

            <div class="d-flex justify-content-between align-items-center mt-2">
              <button id="speakInputBtn" class="btn btn-sm btn-outline-light" type="button">
                🔊 Listen
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- SWAP BUTTON -->
      <div class="col-md-2 text-center">
        <button id="swapBtn" class="btn btn-outline-primary rounded-circle" style="width: 48px; height: 48px;" type="button">
          ⇄
        </button>
      </div>

      <!-- RIGHT CARD: output -->
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <select id="targetLang" class="form-select mb-3">
              {% for name, code in supported_languages.items() %}
                <option value="{{ code }}" {% if code == "fr" %}selected{% endif %}>{{ name.title() }}</option>
              {% endfor %}
            </select>

            <textarea id="outputText" class="form-control bg-light" style="color: black;" rows="8" placeholder="Translation will appear here..." readonly></textarea>

            <div class="d-flex justify-content-between align-items-center mt-2">
              <button id="speakOutputBtn" class="btn btn-sm btn-outline-light" type="button">
                🔊 Listen
              </button>
              <button id="copyBtn" class="btn btn-sm btn-outline-light" type="button">
                📋 Copy
              </button>
            </div>
          </div>
        </div>
      </div>

    </div> <!-- closes .row -->

    <div class="text-center mt-4">
      <button id="translateBtn" class="btn btn-primary btn-lg px-5" type="button">Translate</button>
      <p id="statusMsg" class="text-danger mt-3"></p>
    </div>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
